<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApnaJotish - Vedic Kundli Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 50%, #d4511f 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        /* Intro Video */
        .intro-video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .intro-video-overlay.hidden {
            display: none;
        }

        .video-container {
            width: 90%;
            max-width: 800px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .video-container video {
            width: 100%;
            display: block;
        }

        .skip-video-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .skip-video-btn:hover {
            background: #e67e22;
            transform: scale(1.05);
        }

        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 15px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .music-player audio {
            display: none;
        }

        .music-status {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        .music-status.playing::before {
            content: "♫ Playing";
            color: #27ae60;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 40px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-text h1 {
            font-size: 28px;
            color: #f39c12;
            margin: 0;
            font-weight: 800;
        }

        .logo-text p {
            font-size: 12px;
            color: #e67e22;
            margin: 0;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #f39c12;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Section Tabs */
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #f39c12;
            color: white;
            border-color: #f39c12;
        }

        .tab-btn:hover {
            border-color: #f39c12;
            color: #f39c12;
        }

        /* Section Content */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Styles */
        .form-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-card h2 {
            color: #f39c12;
            margin-bottom: 30px;
            font-size: 24px;
            border-bottom: 3px solid #f39c12;
            padding-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            grid-column: 1 / -1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Results Card */
        .results-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .results-card h3 {
            color: #f39c12;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f39c12;
            padding-bottom: 10px;
        }

        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .planet-card {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .planet-card h4 {
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 8px;
        }

        .planet-info {
            font-size: 13px;
            line-height: 1.8;
        }

        .planet-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .planet-info-label {
            font-weight: 600;
            opacity: 0.9;
        }

        .planet-info-value {
            font-weight: 700;
        }

        /* Dasha Card */
        .dasha-card {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .dasha-card h4 {
            color: #f39c12;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .dasha-info {
            font-size: 14px;
            line-height: 1.8;
        }

        .dasha-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Divisional Charts */
        .divisional-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #f39c12;
        }

        .chart-card h4 {
            color: #f39c12;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .chart-content {
            max-height: 400px;
            overflow-y: auto;
        }

        .chart-planet {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .chart-planet:last-child {
            border-bottom: none;
        }

        .chart-planet-name {
            font-weight: 600;
            color: #333;
        }

        .chart-planet-rashi {
            color: #f39c12;
            font-weight: 600;
        }

        /* Question Section */
        .question-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .question-card h2 {
            color: #f39c12;
            margin-bottom: 20px;
        }

        .question-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .question-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .question-input-group input:focus {
            outline: none;
            border-color: #f39c12;
        }

        .question-input-group button {
            padding: 12px 30px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-input-group button:hover {
            background: #e67e22;
        }

        .interpretation-box {
            background: #f8f9fa;
            padding: 20px;
            border-left: 4px solid #f39c12;
            border-radius: 8px;
            line-height: 1.8;
            color: #333;
        }

        /* Loading States */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin-loader 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin-loader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #f39c12;
            font-weight: 600;
        }

        /* Error Messages */
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3c3;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .form-card,
            .results-card,
            .question-card {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .planet-grid {
                grid-template-columns: 1fr;
            }

            .music-player {
                bottom: 20px;
                right: 20px;
                padding: 12px 15px;
                font-size: 12px;
            }

            .skip-video-btn {
                top: 20px;
                right: 20px;
                padding: 8px 16px;
                font-size: 12px;
            }

            .question-input-group {
                flex-direction: column;
            }

            .question-input-group button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 14px;
            }

            header {
                padding: 15px 20px;
            }

            .logo-text h1 {
                font-size: 22px;
            }

            .container {
                padding: 20px 15px;
            }

            .form-card,
            .results-card,
            .question-card {
                padding: 20px;
            }

            .tabs {
                gap: 10px;
            }

            .tab-btn {
                padding: 10px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Intro Video Overlay -->
    <div class="intro-video-overlay" id="introOverlay">
        <button class="skip-video-btn" onclick="skipVideo()">Skip</button>
        <div class="video-container">
            <video id="introVideo" autoplay muted playsinline>
                <source src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <audio id="bgMusic" autoplay loop>
            <source src="" type="audio/mpeg">
        </audio>
        <span class="music-status"></span>
    </div>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">🔮</div>
                <div class="logo-text">
                    <h1>ApnaJotish</h1>
                    <p>VEDIC KUNDLI ENGINE</p>
                </div>
            </div>
            <nav class="nav-links">
                <a onclick="switchSection('calculator')">Calculator</a>
                <a onclick="switchSection('interpretation')">Ask Question</a>
                <a href="#" onclick="event.preventDefault(); alert('API Status: Connected ✓')">Status</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSection('calculator')">📊 Calculator</button>
            <button class="tab-btn" onclick="switchSection('interpretation')">🤖 Interpretation</button>
        </div>

        <!-- Calculator Section -->
        <div id="calculator" class="section active">
            <!-- Birth Data Form -->
            <div class="form-card">
                <h2>Calculate Your Kundli</h2>
                <form id="kundliForm" onsubmit="calculateKundli(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="name" required placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input type="date" id="dob" required>
                        </div>
                        <div class="form-group">
                            <label>Time of Birth *</label>
                            <input type="time" id="time" required>
                        </div>
                        <div class="form-group">
                            <label>Place of Birth *</label>
                            <input type="text" id="place" required placeholder="e.g., Mumbai, India">
                        </div>
                        <div class="form-group">
                            <label>Latitude (Optional)</label>
                            <input type="number" id="latitude" placeholder="e.g., 19.0760" step="0.0001">
                        </div>
                        <div class="form-group">
                            <label>Longitude (Optional)</label>
                            <input type="number" id="longitude" placeholder="e.g., 72.8777" step="0.0001">
                        </div>
                        <div class="form-group">
                            <label>Timezone *</label>
                            <select id="timezone" required>
                                <option value="">Select Timezone</option>
                                <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                                <option value="UTC">UTC</option>
                                <option value="America/New_York">America/New_York (EST)</option>
                                <option value="America/Chicago">America/Chicago (CST)</option>
                                <option value="America/Denver">America/Denver (MST)</option>
                                <option value="America/Los_Angeles">America/Los_Angeles (PST)</option>
                                <option value="Europe/London">Europe/London (GMT)</option>
                                <option value="Europe/Paris">Europe/Paris (CET)</option>
                                <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
                                <option value="Australia/Sydney">Australia/Sydney (AEDT)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Time Accuracy *</label>
                            <select id="timeAccuracy" required>
                                <option value="exact">Exact (to the minute)</option>
                                <option value="approximate">Approximate (within 15 mins)</option>
                                <option value="unknown">Unknown (sunrise assumed)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Calculate Kundli</button>
                </form>
                <div id="formMessage"></div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" style="display: none;">
                <div class="results-card">
                    <h3>Birth Information</h3>
                    <div id="birthInfo" class="planet-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));"></div>
                </div>

                <div class="results-card">
                    <h3>🌍 Planetary Positions</h3>
                    <div id="planetsResult" class="planet-grid"></div>
                </div>

                <div class="results-card">
                    <h3>⏳ Vimshottari Dasha</h3>
                    <div id="dashaResult"></div>
                </div>

                <div class="results-card">
                    <h3>🔢 Divisional Charts</h3>
                    <div class="divisional-section" id="vargasResult"></div>
                </div>
            </div>
        </div>

        <!-- Interpretation Section -->
        <div id="interpretation" class="section">
            <div class="question-card">
                <h2>Ask Your Question</h2>
                <p style="color: #666; margin-bottom: 20px;">Ask any question about your life based on your calculated Kundli</p>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Your Question *</label>
                    <textarea id="questionInput" placeholder="e.g., When will I get married? What's my career path?"
                              style="padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; min-height: 100px; resize: vertical; font-family: inherit;">
                    </textarea>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Aspect of Life (Optional)</label>
                    <select id="aspect" style="padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <option value="">General</option>
                        <option value="marriage">Marriage & Relationships</option>
                        <option value="career">Career & Profession</option>
                        <option value="health">Health & Wellness</option>
                        <option value="finance">Finance & Wealth</option>
                    </select>
                </div>

                <button class="btn-primary" onclick="askQuestion()" style="grid-column: unset; width: 100%;">Get Interpretation</button>
                <div id="questionMessage"></div>
            </div>

            <div id="interpretationSection" style="display: none;">
                <div class="results-card">
                    <h3>🔮 Astrological Interpretation</h3>
                    <div class="interpretation-box" id="interpretationResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = window.location.origin;

        // Global state
        let currentKundli = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initializeApp();
        });

        function initializeApp() {
            // Set default timezone
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            document.getElementById('timezone').value = tz || 'UTC';

            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dob').value = today;

            // Start background music
            playBackgroundMusic();

            // Show intro video
            showIntroVideo();
        }

        function showIntroVideo() {
            const overlay = document.getElementById('introOverlay');
            const video = document.getElementById('introVideo');

            // Try to load video from common locations
            const videoSrc = '/video.mp4' || '/gemini_generated_video_EB3B0333.mp4';

            // If video can't be loaded, auto-skip after 3 seconds
            setTimeout(() => {
                if (video.readyState === 0) {
                    skipVideo();
                }
            }, 3000);

            video.addEventListener('ended', skipVideo, { once: true });
        }

        function skipVideo() {
            const overlay = document.getElementById('introOverlay');
            overlay.classList.add('hidden');
        }

        function playBackgroundMusic() {
            const audio = document.getElementById('bgMusic');
            const status = document.querySelector('.music-status');

            // Try to load music from common locations
            audio.src = '/music.mp3' || '/background-music.mp3' || '';

            audio.play().then(() => {
                status.textContent = '♫ Playing';
            }).catch(err => {
                console.log('Music autoplay prevented:', err);
                // Try again on user interaction
                document.addEventListener('click', () => {
                    if (audio.paused) {
                        audio.play().catch(() => {});
                    }
                }, { once: true });
            });

            audio.addEventListener('play', () => {
                status.textContent = '♫ Playing';
            });

            audio.addEventListener('pause', () => {
                status.textContent = '⏸ Paused';
            });

            audio.addEventListener('ended', () => {
                audio.currentTime = 0;
                audio.play();
            });
        }

        function switchSection(sectionId) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            // Show selected section
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        async function calculateKundli(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const dob = document.getElementById('dob').value;
            const time = document.getElementById('time').value;
            const place = document.getElementById('place').value;
            const latitude = document.getElementById('latitude').value || null;
            const longitude = document.getElementById('longitude').value || null;
            const timezone = document.getElementById('timezone').value;
            const timeAccuracy = document.getElementById('timeAccuracy').value;

            const formMessage = document.getElementById('formMessage');
            const resultsSection = document.getElementById('resultsSection');

            // Clear previous messages
            formMessage.innerHTML = '';
            resultsSection.style.display = 'none';

            // Show loading state
            const button = event.target.querySelector('.btn-primary');
            const originalText = button.textContent;
            button.classList.add('loading');
            button.textContent = '🔄 Calculating...';

            try {
                // Format time
                const [hours, minutes] = time.split(':');
                const formattedTime = `${hours}:${minutes}:00`;

                const response = await fetch(`${API_BASE_URL}/api/kundli/calculate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        dob,
                        time: formattedTime,
                        place,
                        latitude: latitude ? parseFloat(latitude) : null,
                        longitude: longitude ? parseFloat(longitude) : null,
                        timezone,
                        timeAccuracy
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Calculation failed');
                }

                currentKundli = data.data;
                displayResults(data.data);
                resultsSection.style.display = 'block';

                formMessage.innerHTML = '<div class="success-message">✅ Kundli calculated successfully!</div>';

            } catch (error) {
                console.error('Error:', error);
                formMessage.innerHTML = `<div class="error-message">❌ ${error.message}</div>`;
            } finally {
                button.classList.remove('loading');
                button.textContent = originalText;
            }
        }

        function displayResults(kundli) {
            // Birth Information
            const birthInfo = document.getElementById('birthInfo');
            birthInfo.innerHTML = `
                <div class="planet-card">
                    <h4>👤 Name</h4>
                    <div class="planet-info">${kundli.birth.name}</div>
                </div>
                <div class="planet-card">
                    <h4>📅 Date of Birth</h4>
                    <div class="planet-info">${kundli.birth.date}</div>
                </div>
                <div class="planet-card">
                    <h4>⏰ Time</h4>
                    <div class="planet-info">${kundli.birth.time}</div>
                </div>
                <div class="planet-card">
                    <h4>📍 Location</h4>
                    <div class="planet-info">${kundli.birth.place}</div>
                </div>
                <div class="planet-card">
                    <h4>🏠 Ascendant (Lagna)</h4>
                    <div class="planet-info">${kundli.ascendant.rashi}</div>
                </div>
                <div class="planet-card">
                    <h4>🔬 System</h4>
                    <div class="planet-info">${kundli.calculation.zodiac}<br>${kundli.calculation.ayanamsha}</div>
                </div>
            `;

            // Planetary Positions
            const planetsResult = document.getElementById('planetsResult');
            planetsResult.innerHTML = kundli.planets.map(planet => `
                <div class="planet-card">
                    <h4>${getPlanetEmoji(planet.planet)} ${planet.planet}</h4>
                    <div class="planet-info">
                        <div class="planet-info-row">
                            <span class="planet-info-label">Longitude:</span>
                            <span class="planet-info-value">${planet.longitude.toFixed(2)}°</span>
                        </div>
                        <div class="planet-info-row">
                            <span class="planet-info-label">Rashi:</span>
                            <span class="planet-info-value">${planet.rashi}</span>
                        </div>
                        <div class="planet-info-row">
                            <span class="planet-info-label">Nakshatra:</span>
                            <span class="planet-info-value">${planet.nakshatra}</span>
                        </div>
                        <div class="planet-info-row">
                            <span class="planet-info-label">Pada:</span>
                            <span class="planet-info-value">${planet.pada}</span>
                        </div>
                        <div class="planet-info-row">
                            <span class="planet-info-label">House:</span>
                            <span class="planet-info-value">${planet.house || 'N/A'}</span>
                        </div>
                        ${planet.retrograde ? `<div class="planet-info-row"><span class="planet-info-label">⬅️ Retrograde</span></div>` : ''}
                    </div>
                </div>
            `).join('');

            // Dasha Information
            const dashaResult = document.getElementById('dashaResult');
            const current = kundli.dasha.current;
            dashaResult.innerHTML = `
                <div class="dasha-card">
                    <h4>Current Mahadasha</h4>
                    <div class="dasha-info">
                        <div class="dasha-info-row">
                            <span>Mahadasha:</span>
                            <span>${current.mahadasha}</span>
                        </div>
                        <div class="dasha-info-row">
                            <span>Balance Years:</span>
                            <span>${current.balanceYears.toFixed(2)} years</span>
                        </div>
                        <div class="dasha-info-row">
                            <span>Balance Percentage:</span>
                            <span>${current.balancePercentage.toFixed(1)}%</span>
                        </div>
                        <div class="dasha-info-row">
                            <span>Nakshatra:</span>
                            <span>${current.nakshatra}</span>
                        </div>
                    </div>
                </div>
                ${kundli.dasha.periods.length > 0 ? `
                    <div style="margin-top: 20px;">
                        <h4 style="color: #f39c12; margin-bottom: 15px;">Upcoming Mahadashas</h4>
                        ${kundli.dasha.periods.map((period, idx) => `
                            <div class="dasha-card">
                                <div class="dasha-info">
                                    <div class="dasha-info-row">
                                        <span>${period.planet}</span>
                                        <span>${period.years} years</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
            `;

            // Divisional Charts
            if (kundli.vargas) {
                const vargasResult = document.getElementById('vargasResult');
                vargasResult.innerHTML = ['D9', 'D10', 'D12'].map(vargaKey => {
                    const varga = kundli.vargas[vargaKey];
                    if (!varga || !varga.planets) return '';

                    return `
                        <div class="chart-card">
                            <h4>${vargaKey} - ${varga.name}</h4>
                            <p style="font-size: 12px; color: #666; margin-bottom: 12px;">${varga.description}</p>
                            <div class="chart-content">
                                ${Object.entries(varga.planets).slice(0, 7).map(([planet, data]) => `
                                    <div class="chart-planet">
                                        <span class="chart-planet-name">${planet}</span>
                                        <span class="chart-planet-rashi">${data.rashi}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        async function askQuestion() {
            if (!currentKundli) {
                alert('Please calculate your Kundli first!');
                document.querySelector('[onclick*="calculator"]').click();
                return;
            }

            const question = document.getElementById('questionInput').value;
            const aspect = document.getElementById('aspect').value;

            if (!question.trim()) {
                alert('Please enter a question');
                return;
            }

            const questionMessage = document.getElementById('questionMessage');
            const interpretationSection = document.getElementById('interpretationSection');
            const interpretationResult = document.getElementById('interpretationResult');

            questionMessage.innerHTML = '';
            interpretationSection.style.display = 'none';

            // Show loading
            const button = event.target;
            const originalText = button.textContent;
            button.classList.add('loading');
            button.textContent = '🔮 Getting interpretation...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/kundli/interpret`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        kundli: currentKundli,
                        question,
                        aspect: aspect || null
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Interpretation failed');
                }

                interpretationResult.innerHTML = `
                    <div style="margin-bottom: 20px;">
                        <strong style="color: #f39c12;">Your Question:</strong><br>
                        ${question}
                    </div>
                    <div style="margin-bottom: 15px; line-height: 1.8; color: #333;">
                        ${data.interpretation}
                    </div>
                    ${data.evidence ? `
                        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 13px; color: #666;">
                            <strong>Based on:</strong><br>
                            ${data.evidence.replace(/\n/g, '<br>')}
                        </div>
                    ` : ''}
                `;

                interpretationSection.style.display = 'block';
                questionMessage.innerHTML = '<div class="success-message">✅ Interpretation generated!</div>';

            } catch (error) {
                console.error('Error:', error);
                questionMessage.innerHTML = `<div class="error-message">❌ ${error.message}</div>`;
            } finally {
                button.classList.remove('loading');
                button.textContent = originalText;
            }
        }

        function getPlanetEmoji(planet) {
            const emojis = {
                'SUN': '☉',
                'MOON': '☽',
                'MARS': '♂',
                'MERCURY': '☿',
                'JUPITER': '♃',
                'VENUS': '♀',
                'SATURN': '♄',
                'RAHU': '☊',
                'KETU': '☋'
            };
            return emojis[planet] || '🌟';
        }
    </script>
</body>
